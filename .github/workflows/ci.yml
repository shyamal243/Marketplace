name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run backend tests
        working-directory: apps/api
        run: |
          VITEST_DIR=$(find ../../node_modules/.pnpm -maxdepth 1 -type d -name "vitest@*" | head -1)
          echo "Found vitest at: $VITEST_DIR"
          node "$VITEST_DIR/node_modules/vitest/vitest.mjs" run
