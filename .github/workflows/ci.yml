name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run backend tests
        working-directory: apps/api
        run: node ../../node_modules/.pnpm/vitest@5.0.0_@types+node@22_d714a4acc628adca993634a8e3384f38/node_modules/vitest/vitest.mjs run
